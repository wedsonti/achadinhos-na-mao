<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="85%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#D62800"/>
    </radialGradient>
    <linearGradient id="atGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCA10"/>
      <stop offset="50%" stop-color="#FF8500"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="256" cy="230" r="185" fill="url(#badgeBg)" stroke="#18181B" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="230" r="168" fill="none" stroke="#FFB03B" stroke-width="5" opacity="0.6"/>

  <!-- Character: Man with curly hair and mustache -->
  <g id="character">
    <!-- Body / Shoulders (White t-shirt) -->
    <path d="M 160 365 C 160 315 200 295 256 295 C 312 295 352 315 352 365 Z" fill="#FFFFFF" stroke="#18181B" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 210 295 C 230 315 282 315 302 295" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="236" y="270" width="40" height="35" fill="#FFD1A9" stroke="#18181B" stroke-width="7"/>

    <!-- Head -->
    <ellipse cx="256" cy="210" rx="64" ry="74" fill="#FFD1A9" stroke="#18181B" stroke-width="8"/>

    <!-- Ears -->
    <circle cx="188" cy="215" r="12" fill="#FFD1A9" stroke="#18181B" stroke-width="6"/>
    <circle cx="324" cy="215" r="12" fill="#FFD1A9" stroke="#18181B" stroke-width="6"/>

    <!-- Curly Hair (top & sides) -->
    <path d="M 192 185 C 180 145 200 115 240 115 C 260 110 280 115 295 125 C 315 115 335 135 330 165 C 340 185 335 210 320 220 C 320 180 290 145 250 145 C 215 145 195 165 192 185 Z" fill="#18181B" stroke="#18181B" stroke-width="4"/>
    <!-- Additional curly bumps -->
    <circle cx="210" cy="135" r="22" fill="#18181B"/>
    <circle cx="240" cy="120" r="25" fill="#18181B"/>
    <circle cx="275" cy="122" r="24" fill="#18181B"/>
    <circle cx="305" cy="140" r="22" fill="#18181B"/>
    <circle cx="325" cy="170" r="18" fill="#18181B"/>
    <circle cx="190" cy="175" r="18" fill="#18181B"/>

    <!-- Eyes -->
    <circle cx="232" cy="195" r="7" fill="#18181B"/>
    <circle cx="280" cy="195" r="7" fill="#18181B"/>
    <!-- Eyebrows -->
    <path d="M 220 182 Q 232 176 244 182" fill="none" stroke="#18181B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 268 182 Q 280 176 292 182" fill="none" stroke="#18181B" stroke-width="5" stroke-linecap="round"/>

    <!-- Mustache -->
    <path d="M 236 222 C 242 214 270 214 276 222 C 282 230 262 238 256 230 C 250 238 230 230 236 222 Z" fill="#18181B"/>

    <!-- Smile -->
    <path d="M 242 238 Q 256 250 270 238" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>

    <!-- Pointing Arm & Hand -->
    <path d="M 195 330 Q 155 315 175 285 Q 185 275 205 280 L 235 295" fill="none" stroke="#FFD1A9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 330 Q 155 315 175 285 Q 185 275 205 280 L 235 295" fill="none" stroke="#18181B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Finger pointing towards laptop -->
    <path d="M 220 288 L 255 278" fill="none" stroke="#FFD1A9" stroke-width="12" stroke-linecap="round"/>
    <path d="M 220 288 L 255 278" fill="none" stroke="#18181B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Laptop -->
  <g id="laptop">
    <!-- Laptop Base -->
    <path d="M 255 335 L 365 315 L 390 345 L 230 345 Z" fill="#334155" stroke="#18181B" stroke-width="7" stroke-linejoin="round"/>
    <!-- Laptop Screen (open) -->
    <path d="M 265 325 L 360 250 L 390 315 L 295 335 Z" fill="#1E293B" stroke="#18181B" stroke-width="8" stroke-linejoin="round"/>
    <!-- Screen Inner Display -->
    <path d="M 276 315 L 350 262 L 372 308 L 298 322 Z" fill="#0F172A"/>
    <!-- Lightning Bolt on Screen -->
    <polygon points="325,272 312,292 328,292 318,312 342,288 326,288" fill="#FF7A00" stroke="#18181B" stroke-width="2"/>
    <!-- Hands holding laptop -->
    <ellipse cx="320" cy="330" rx="14" ry="9" fill="#FFD1A9" stroke="#18181B" stroke-width="5" transform="rotate(25 320 330)"/>
  </g>

  <!-- AT promo Text below -->
  <g id="logo-text" transform="translate(256, 430)">
    <!-- 'AT' in Orange with 3D shadow -->
    <text x="-65" y="0" font-family="'Arial Black', Impact, sans-serif" font-size="75" font-weight="900" fill="#18181B" text-anchor="middle" dx="3" dy="3">AT</text>
    <text x="-65" y="0" font-family="'Arial Black', Impact, sans-serif" font-size="75" font-weight="900" fill="url(#atGrad)" stroke="#18181B" stroke-width="6" text-anchor="middle">AT</text>

    <!-- 'promo' in Dark Charcoal -->
    <text x="65" y="-2" font-family="'Arial Black', Impact, sans-serif" font-size="62" font-weight="900" fill="#18181B" stroke="#18181B" stroke-width="4" text-anchor="middle">promo</text>
    <text x="65" y="-2" font-family="'Arial Black', Impact, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" text-anchor="middle">promo</text>
  </g>
</svg>
